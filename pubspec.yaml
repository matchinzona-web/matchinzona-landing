name: app_campi
description: "App per Prenotazione e gestione dei Campi Sportivi"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  intl_phone_field: ^3.2.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  syncfusion_flutter_calendar: ^33.2.7
  flutter_riverpod: ^3.3.1
  syncfusion_flutter_datepicker: ^33.2.7
  syncfusion_flutter_sliders: ^33.2.7
  video_player: ^2.11.1
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  shared_preferences: ^2.5.5
  geocoding: ^4.0.0
  syncfusion_localizations: ^33.2.7
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  internet_connection_checker_plus: ^2.7.2

  url_launcher: ^6.3.0
  app_links: ^6.4.0
  intl: ^0.20.2
  flutter_stripe: ^14.0.0
  firebase_core: ^4.15.0
  firebase_messaging: 16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo_app.png"
  background_color_android: "#121212"
